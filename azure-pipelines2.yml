trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: New variable group 27-Jul

- name: solution
  value: '**/*.sln'

- name: buildConfiguration
  value: 'Release'

steps:

# ---------------------------------------------------------
# Restore
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Restore packages
  inputs:
    command: restore
    projects: '$(solution)'

# ---------------------------------------------------------
# Build
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Build solution
  inputs:
    command: build
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration)'

# ---------------------------------------------------------
# Build EF Core migration bundle
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Build EF migration bundle
  inputs:
    command: custom
    custom: ef
    arguments: "migrations bundle --project SampleDataAccessApi --output efbundle"

# ---------------------------------------------------------
# Run EF migration bundle against Azure SQL
# ---------------------------------------------------------
- task: Bash@3
  displayName: Run EF migration bundle
  inputs:
    targetType: inline
    script: |
      echo "Running EF migration bundle..."
      chmod +x efbundle

      ./efbundle \
        --connection "$(sampleapiDBConnectionstring)"

# ---------------------------------------------------------
# Test + Coverage
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Run tests with coverage
  inputs:
    command: test
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage"'

# ---------------------------------------------------------
# Publish coverage
# ---------------------------------------------------------
- task: PublishCodeCoverageResults@1
  displayName: Publish coverage
  inputs:
    codeCoverageTool: Cobertura
    summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
    reportDirectory: '$(Agent.TempDirectory)'

# ---------------------------------------------------------
# Install Docker
# ---------------------------------------------------------
- task: DockerInstaller@0
  displayName: Install Docker

# ---------------------------------------------------------
# Build Docker image (Docker Hub)
# ---------------------------------------------------------
- script: |
    docker build -t popdemar/sampledataaccessapi:$(Build.BuildId) .
  displayName: Build Docker Image

# ---------------------------------------------------------
# Login to Docker Hub
# ---------------------------------------------------------
- script: |
    echo $(DOCKERHUB_TOKEN) | docker login -u popdemar --password-stdin
  displayName: Docker Login

# ---------------------------------------------------------
# Push Docker image
# ---------------------------------------------------------
- script: |
    docker push popdemar/sampledataaccessapi:$(Build.BuildId)
    docker tag popdemar/sampledataaccessapi:$(Build.BuildId) popdemar/sampledataaccessapi:latest
    docker push popdemar/sampledataaccessapi:latest
  displayName: Push Docker Image

# ---------------------------------------------------------
# Inject SQL connection string secret into ACA
# ---------------------------------------------------------
- task: AzureCLI@2
  displayName: "Set ACA secret: DefaultConnectionString"
  inputs:
    #azureSubscription: 'Azure subscription 1(c13b401c-dde4-4298-ad6c-3ef836f847d5)'
    #azureSubscription: 'Azure subscription 1'
    azureSubscription: 'SampleDataAccessApi_ServiceConnection'

    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Setting ACA secret DefaultConnectionString..."
      az containerapp secret set \
        --name sampledataaccessapi \
        --resource-group SampleDataAccessApi_rg \
        --secrets DefaultConnectionString=$(sampleapiDBConnectionstring)

# ---------------------------------------------------------
# Update ACA to use new Docker Hub image
# ---------------------------------------------------------
- task: AzureCLI@2
  displayName: "Update ACA revision"
  inputs:
    #azureSubscription: 'Azure subscription 1(c13b401c-dde4-4298-ad6c-3ef836f847d5)'
    #azureSubscription: 'Azure subscription 1'
    azureSubscription: 'SampleDataAccessApi_ServiceConnection'

    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Updating ACA to new image..."
      az containerapp update \
        --name sampledataaccessapi \
        --resource-group SampleDataAccessApi_rg \
        --image popdemar/sampledataaccessapi:latest
