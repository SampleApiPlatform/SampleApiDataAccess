trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: DockerInstaller@0

- script: |
    echo "$(DOCKERHUB_TOKEN)" | docker login -u "$(DOCKERHUB_USERNAME)" --password-stdin
  displayName: Login to Docker Hub

- script: |
    docker build -t $(DOCKERHUB_USERNAME)/sampleapi:$(Build.BuildId) .
  displayName: Build Docker image

- script: |
    docker push $(DOCKERHUB_USERNAME)/sampleapi:$(Build.BuildId)
  displayName: Push Docker image

- script: |
    docker tag $(DOCKERHUB_USERNAME)/sampleapi:$(Build.BuildId) $(DOCKERHUB_USERNAME)/sampleapi:latest
    docker push $(DOCKERHUB_USERNAME)/sampleapi:latest
  displayName: Push latest tag
