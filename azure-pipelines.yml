trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: New variable group 27-Jul

- name: solution
  value: '**/*.sln'

- name: buildConfiguration
  value: 'Release'

steps:

# ---------------------------------------------------------
# Install .NET 8 SDK (Fix für Root/NuGet Permission Fehler)
# ---------------------------------------------------------
- task: UseDotNet@2
  displayName: Install .NET SDK 8
  inputs:
    packageType: sdk
    version: 8.0.x


# ---------------------------------------------------------
# Restore
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Restore packages
  inputs:
    command: restore
    projects: '$(solution)'

# ---------------------------------------------------------
# Build
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Build solution
  inputs:
    command: build
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration)'

# ---------------------------------------------------------
# Build EF Core migration bundle
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Build EF migration bundle
  inputs:
    command: custom
    custom: ef
    arguments: "migrations bundle --project SampleDataAccessApi --output efbundle"

# ---------------------------------------------------------
# Run EF migration bundle
# ---------------------------------------------------------
- task: Bash@3
  displayName: Run EF migration bundle
  inputs:
    targetType: inline
    script: |
      echo "Running EF migration bundle..."
      chmod +x efbundle
      ./efbundle --connection "$(sampleapiDBConnectionstring)"

# ---------------------------------------------------------
# Test + Coverage
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Run tests with coverage
  inputs:
    command: test
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage"'

# ---------------------------------------------------------
# Publish coverage
# ---------------------------------------------------------
- task: PublishCodeCoverageResults@1
  displayName: Publish coverage
  inputs:
    codeCoverageTool: Cobertura
    summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
    reportDirectory: '$(Agent.TempDirectory)'

# ---------------------------------------------------------
# Build Docker image (Linux)
# ---------------------------------------------------------
- task: Docker@2
  displayName: Build Docker image
  inputs:
    command: build
    Dockerfile: SampleDataAccessApi/Dockerfile
    repository: $(DOCKERHUB_USERNAME)/sampledataaccessapi
    tags: |
      latest

# ---------------------------------------------------------
# Login to Docker Hub
# ---------------------------------------------------------
- task: Docker@2
  displayName: Login to Docker Hub
  inputs:
    command: login
    containerRegistry: $(DOCKERHUB_SERVICE_CONNECTION)

# ---------------------------------------------------------
# Push Docker image
# ---------------------------------------------------------
- task: Docker@2
  displayName: Push Docker image
  inputs:
    command: push
    repository: $(DOCKERHUB_USERNAME)/sampledataaccessapi
    tags: |
      latest

# ---------------------------------------------------------
# Update ACA image
# ---------------------------------------------------------
- task: AzureCLI@2
  displayName: Update ACA image
  inputs:
    azureSubscription: 'SampleDataAccessApi_ServiceConnection'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Updating ACA image..."
      az containerapp update \
        --name sampledataaccessapi \
        --resource-group SampleAccessDataApi_rg \
        --image docker.io/$(DOCKERHUB_USERNAME)/sampledataaccessapi:latest
