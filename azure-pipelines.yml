trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: New variable group 27-Jul

- name: solution
  value: '**/*.sln'

- name: buildPlatform
  value: 'Any CPU'

- name: buildConfiguration
  value: 'Release'

steps:

# ---------------------------------------------------------
# Fix NuGet permission issue
# ---------------------------------------------------------
- script: |
    export NUGET_PACKAGES=$(Build.SourcesDirectory)/.nuget
    echo "Using NUGET_PACKAGES=$NUGET_PACKAGES"
  displayName: Configure NuGet package folder

# ---------------------------------------------------------
# Restore
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Restore packages
  inputs:
    command: restore
    projects: '$(solution)'
    arguments: '--packages $(Build.SourcesDirectory)/.nuget'

# ---------------------------------------------------------
# Build
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Build solution
  inputs:
    command: build
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --packages $(Build.SourcesDirectory)/.nuget'

# ---------------------------------------------------------
# Build API project (debug errors)
# ---------------------------------------------------------
- script: |
    export NUGET_PACKAGES=$(Build.SourcesDirectory)/.nuget
    cd SampleDataAccessApi
    dotnet build SampleDataAccessApi.csproj
  displayName: Build API project (debug errors)

# ---------------------------------------------------------
# Install dotnet-ef
# ---------------------------------------------------------
- script: |
    export NUGET_PACKAGES=$(Build.SourcesDirectory)/.nuget
    dotnet tool install --global dotnet-ef
    export PATH="$PATH:/home/vsts/.dotnet/tools"
    dotnet ef --version
  displayName: Install dotnet-ef

# ---------------------------------------------------------
# Build EF Core migration bundle
# ---------------------------------------------------------
- script: |
    export NUGET_PACKAGES=$(Build.SourcesDirectory)/.nuget
    cd SampleDataAccessApi
    dotnet ef migrations bundle \
      --project SampleDataAccessApi.csproj \
      --context MoviesDbContext \
      --output ../efbundle
  displayName: Build EF migration bundle

# ---------------------------------------------------------
# Run EF migration bundle against Azure SQL
# ---------------------------------------------------------
- task: Bash@3
  displayName: Run EF migration bundle
  inputs:
    targetType: inline
    script: |
      echo "Running EF migration bundle..."
      chmod +x efbundle

      ./efbundle \
        --connection "$(sampleapiDBConnectionstring)"

# ---------------------------------------------------------
# Run tests
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Run tests with coverage
  inputs:
    command: test
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage"'

# ---------------------------------------------------------
# Publish coverage
# ---------------------------------------------------------
- task: PublishCodeCoverageResults@1
  displayName: Publish coverage
  inputs:
    codeCoverageTool: Cobertura
    summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
    reportDirectory: '$(Agent.TempDirectory)'

# ---------------------------------------------------------
# Install Docker
# ---------------------------------------------------------
- task: DockerInstaller@0
  displayName: Install Docker

# ---------------------------------------------------------
# Login to Docker Hub
# ---------------------------------------------------------
- script: |
    echo "$(DOCKERHUB_TOKEN)" | docker login -u "$(DOCKERHUB_USERNAME)" --password-stdin
  displayName: Login to Docker Hub

# ---------------------------------------------------------
# Build Docker image
# ---------------------------------------------------------
- script: |
    docker build -t $(DOCKERHUB_USERNAME)/sampledataaccessapi:$(Build.BuildId) .
  displayName: Build Docker image

# ---------------------------------------------------------
# Push Docker image
# ---------------------------------------------------------
- script: |
    docker push $(DOCKERHUB_USERNAME)/sampledataaccessapi:$(Build.BuildId)
  displayName: Push Docker image

# ---------------------------------------------------------
# Tag & Push latest
# ---------------------------------------------------------
- script: |
    docker tag $(DOCKERHUB_USERNAME)/sampledataaccessapi:$(Build.BuildId) $(DOCKERHUB_USERNAME)/sampledataaccessapi:latest
    docker push $(DOCKERHUB_USERNAME)/sampledataaccessapi:latest
  displayName: Push latest tag

# ---------------------------------------------------------
# Inject SQL connection string secret into Azure Container Apps
# ---------------------------------------------------------
- task: AzureCLI@2
  displayName: "Set ACA secret: MoviesDb"
  inputs:
    azureSubscription: 'Azure subscription 1(c13b401c-dde4-4298-ad6c-3ef836f847d5)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Setting ACA secret MoviesDb..."
      az containerapp secret set \
        --name sampledataaccessapi \
        --resource-group sampleapi-rg \
        --secrets MoviesDb=$(sampleapiDBConnectionstring)

# ---------------------------------------------------------
# Update Azure Container App to use new Docker Hub image
# ---------------------------------------------------------
- task: AzureCLI@2
  displayName: "Update ACA image"
  inputs:
    azureSubscription: 'Azure subscription 1(c13b401c-dde4-4298-ad6c-3ef836f847d5)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Updating Container App image..."
      az containerapp update \
        --name sampledataaccessapi \
        --resource-group sampleapi-rg \
        --image $(DOCKERHUB_USERNAME)/sampledataaccessapi:latest
